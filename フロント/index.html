<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空き家AIプランナー</title>
    <!-- Tailwind CSS & Leaflet CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- ヘッダー -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>🏠</span> 空き家AIプランナー
            </h1>
            <a id="chat-link" href="#" target="_blank" rel="noopener"
               class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full font-semibold transition-colors">
                💬 AIに相談する
            </a>
        </div>
        <span class="bg-emerald-600 text-xs px-3 py-1 rounded-full font-semibold">VORN Challenge 2026</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 左カラム：マップと物件選択 -->
        <section class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-slate-700">
                    <span>📍</span> 候補物件マップ
                </h2>
                <div id="map" class="h-64 rounded-lg border border-slate-200 z-0"></div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <!-- 都道府県フィルター -->
                <div>
                    <label for="prefSelect" class="block text-sm font-bold text-slate-700 mb-1">エリアを選択</label>
                    <select id="prefSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="all">すべてのエリア</option>
                    </select>
                </div>

                <!-- 物件選択プルダウン -->
                <div>
                    <label for="houseSelect" class="block text-sm font-bold text-slate-700 mb-1">物件を選択</label>
                    <select id="houseSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">読込中...</option>
                    </select>
                </div>

                <!-- 詳細表示エリア -->
                <div id="houseDetail" class="text-sm space-y-1.5 pt-2 border-t border-slate-100 text-slate-600">
                    <p class="font-bold text-slate-800 text-base" id="detailName">物件を選択してください</p>
                    <p id="detailCost">改修コスト概算: -</p>
                    <p id="detailUsage">想定用途: -</p>
                    <p id="detailAddress">所在地: -</p>
                </div>

            </div>
        </section>

        <!-- 右カラム：収支シミュレーション & PDF出力 -->
        <section class="space-y-4 flex flex-col">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-slate-700">
                    <span>📊</span> 収支シミュレーション
                </h2>
                <div class="relative w-full h-64">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-slate-700">
                    <span>💰</span> 利用できる補助金
                </h2>
                <div id="subsidyList" class="space-y-2 text-sm">
                    <p class="text-slate-500">物件を選択してください</p>
                </div>
            </div>

            <button onclick="downloadPDF()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-auto">
                <span>📄</span> 提案書(PDF)を出力・ダウンロード
            </button>
        </section>

    </main>

    <!-- JS ロジック -->
    <script>
        let map, chartInstance;
        let propertyData = [];
        let selectedMarker = null;
        const API_BASE_URL = window.location.port === '8080'
            ? ''
            : 'http://localhost:8080';

        // AIチャット(A担当作成)へのリンク先。すでに公開済みのURLをデフォルトにしています。
        // ローカルでチャット側を動かして試す場合は 'http://localhost:8000/chat' に書き換えてください。
        const CHAT_URL = "https://empty-house2026.onrender.com/chat";
        document.getElementById("chat-link").href = CHAT_URL;

        document.addEventListener("DOMContentLoaded", () => {
            initMap();
            fetchProperties();

            document.getElementById('prefSelect').addEventListener('change', (e) => {
                filterProperties(e.target.value);
            });
        });

        function initMap() {
            map = L.map('map').setView([35.809, 139.096], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
        }

        async function fetchProperties() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/properties`);
                propertyData = await res.json();

                const prefectureRes = await fetch(`${API_BASE_URL}/api/prefectures`);
                const prefectures = await prefectureRes.json();
                const prefSelect = document.getElementById('prefSelect');
                prefectures.forEach(prefecture => {
                    const option = document.createElement('option');
                    option.value = prefecture;
                    option.textContent = prefecture;
                    prefSelect.appendChild(option);
                });
                
                filterProperties('all');

                const select = document.getElementById('houseSelect');
                select.addEventListener('change', (e) => updateSelection(e.target.value));

                // チャット(A担当)の「マップ・PDF出力で見る」から特定の物件IDを指定して
                // 遷移してきた場合は、その物件を自動で選択する。
                const params = new URLSearchParams(window.location.search);
                const requestedId = params.get('property_id');
                if (requestedId) {
                    select.value = requestedId;
                    updateSelection(requestedId);
                }

            } catch (err) {
                console.error("物件データの読み込み失敗:", err);
                document.getElementById('houseSelect').innerHTML = '<option value="">データ読み込みエラー</option>';
            }
        }

        function filterProperties(pref) {
            const select = document.getElementById('houseSelect');
            select.innerHTML = '';

            const filtered = propertyData.filter(house => {
                if (pref === 'all') return true;
                const addr = house.address || house.location || '';
                return addr.includes(pref);
            });

            if (filtered.length === 0) {
                select.innerHTML = '<option value="">該当する物件がありません</option>';
                clearDetail();
                return;
            }

            filtered.forEach((house, idx) => {
                const option = document.createElement('option');
                option.value = house.global_id || (idx + 1);
                
                const loc = house.address || house.location || '';
                const name = house.name || house.title || `物件 #${idx + 1}`;
                option.textContent = loc ? `${loc} - ${name}` : name;
                
                select.appendChild(option);
            });

            updateSelection(filtered[0].global_id || 1);
        }

        // 座標補正用関数（データにlat/lngがない場合、住所から近似値を自動割り振る）
        function getCoordinates(house) {
            let lat = parseFloat(house.lat || house.latitude);
            let lng = parseFloat(house.lng || house.longitude);

            if (!isNaN(lat) && !isNaN(lng)) {
                return [lat, lng];
            }

            const address = house.address || house.location || '';
            // 奥多摩周辺のデフォルト座標（少しずつズラして重なりを防止）
            const offset = ((house.global_id || 1) % 10) * 0.005;
            if (address.includes('奥多摩')) return [35.809 + offset, 139.096 + offset];
            if (address.includes('埼玉')) return [35.856 + offset, 139.648 + offset];
            
            return [35.689 + offset, 139.691 + offset]; // デフォルト東京
        }

        function updateSelection(selectedId) {
            const house = propertyData.find(h => String(h.global_id) === String(selectedId) || String(propertyData.indexOf(h) + 1) === String(selectedId));
            if (!house) return;

            document.getElementById('detailName').textContent = house.name || house.title || '-';
            
            const cost = house.renovation_cost_est || house.renovation_cost || house.cost || 0;
            document.getElementById('detailCost').textContent = cost > 0 
                ? `改修コスト概算: ¥${cost.toLocaleString()}` 
                : '改修コスト概算: ¥3,000,000（想定）';

            document.getElementById('detailUsage').textContent = `想定用途: ${house.usage || house.purpose || '地域交流拠点'}`;
            document.getElementById('detailAddress').textContent = `所在地: ${house.address || house.location || '-'}`;
            fetchSubsidies(house.municipality);

            // 座標を取得してピンを配置
            const coords = getCoordinates(house);

            if (selectedMarker) {
                map.removeLayer(selectedMarker);
            }

            selectedMarker = L.marker(coords)
                .addTo(map)
                .bindPopup(`<b>📍 ${house.name || '選択中の物件'}</b>`)
                .openPopup();

            map.flyTo(coords, 13);

            updateChart(house);
        }

        async function fetchSubsidies(municipality) {
            const subsidyList = document.getElementById('subsidyList');
            subsidyList.innerHTML = '<p class="text-slate-500">補助金情報を読み込み中...</p>';

            try {
                const res = await fetch(`${API_BASE_URL}/api/subsidies?municipality=${encodeURIComponent(municipality)}`);
                if (!res.ok) throw new Error('補助金情報の取得に失敗しました');
                const subsidies = await res.json();

                if (subsidies.length === 0) {
                    subsidyList.innerHTML = '<p class="text-slate-500">該当する補助金情報はありません</p>';
                    return;
                }

                subsidyList.innerHTML = subsidies.map(subsidy => `
                    <div class="rounded-lg bg-emerald-50 border border-emerald-100 p-3">
                        <p class="font-bold text-emerald-900">${subsidy.subsidy_name}</p>
                        <p class="text-slate-700 mt-1">対象: ${subsidy.target_type} / 上限: ¥${Number(subsidy.max_amount).toLocaleString()}</p>
                        <p class="text-slate-600">補助率: ${subsidy.rate}</p>
                        <p class="text-slate-600 mt-1">${subsidy.conditions}</p>
                    </div>
                `).join('');
            } catch (err) {
                console.error('補助金情報の読み込み失敗:', err);
                subsidyList.innerHTML = '<p class="text-red-600">補助金情報を読み込めませんでした</p>';
            }
        }

        function clearDetail() {
            document.getElementById('detailName').textContent = '物件を選択してください';
            document.getElementById('detailCost').textContent = '改修コスト概算: -';
            document.getElementById('detailUsage').textContent = '想定用途: -';
            document.getElementById('detailAddress').textContent = '所在地: -';
            document.getElementById('subsidyList').innerHTML = '<p class="text-slate-500">物件を選択してください</p>';
            if (selectedMarker) map.removeLayer(selectedMarker);
            if (chartInstance) chartInstance.destroy();
        }

        function updateChart(house) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const baseRevenue = 120;
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1年目', '2年目', '3年目', '4年目', '5年目'],
                    datasets: [
                        { label: '売上 (万円)', data: [baseRevenue, 140, 160, 175, 190], backgroundColor: '#10b981' },
                        { label: 'コスト (万円)', data: [80, 60, 55, 50, 50], backgroundColor: '#ef4444' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function downloadPDF() {
            const selectedId = document.getElementById('houseSelect').value;
            if (!selectedId) {
                alert("物件を選択してください");
                return;
            }
            window.location.href = `${API_BASE_URL}/api/generate-pdf?id=${selectedId}`;
        }
    </script>
</body>
</html>
