<!doctype html>
<html lang="ja">
<head>
<script>
  // 簡易デモ用のログインガード。サーバー側の本格的な認証ではなく、
  // ブラウザのsessionStorageに「ログイン済み/ゲスト」の状態を持つだけの
  // プロトタイプ実装(タブを閉じるとリセットされる)。未ログインなら、
  // トップ画面より前に必ずログイン画面を通らせるため/loginへ飛ばす。
  (function () {
    try {
      if (!sessionStorage.getItem('akiya_auth')) {
        location.replace('/login');
      }
    } catch (e) { /* storageが使えない環境ではガード無しで続行 */ }
  })();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>空き家AIプランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeece8;
    --panel: #fbfaf8;
    --text: #2f2e2b;
    --muted: #85827a;
    --accent: #3c6e52;
    --accent-deep: #294c39;
    --accent-soft: #e6efe1;
    --clay: #b0603d;
    --clay-soft: #f3e3d8;
    --border: #dcdad3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 620px 420px at 8% -8%, rgba(70,68,62,0.07), transparent 60%),
      radial-gradient(ellipse 520px 420px at 108% 12%, rgba(70,68,62,0.05), transparent 60%),
      radial-gradient(ellipse 700px 520px at 50% 118%, rgba(70,68,62,0.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1, .badge, .choice-title, footer { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }
  .brand-mark {
    width: 56px;
    height: 56px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 14px 4px 14px 4px;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
  }
  .lead {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    max-width: 480px;
    line-height: 1.7;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }
  .choice-card {
    flex: 1 1 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px 26px 26px 26px;
    padding: 30px 24px;
    text-decoration: none;
    color: var(--text);
    text-align: center;
    box-shadow: 0 1px 3px rgba(48,42,32,0.06);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    border-left: 3px solid var(--accent);
  }
  .choice-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px) rotate(-0.4deg);
    box-shadow: 0 6px 14px rgba(48,42,32,0.08);
  }
  .choice-card#map-card {
    border-radius: 26px 4px 26px 26px;
    border-left-color: var(--clay);
  }
  .choice-card#map-card:hover { transform: translateY(-3px) rotate(0.4deg); }
  .choice-icon { font-size: 38px; margin-bottom: 12px; }
  .choice-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .choice-desc { font-size: 12px; color: var(--muted); line-height: 1.7; }
  footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--muted);
  }
  .akiya-status-bar {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    text-align: center;
  }
  .akiya-status-bar a { color: var(--accent-deep); font-weight: 700; text-decoration: none; }
  .akiya-status-bar a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="akiyaStatusBar" class="akiya-status-bar"></div>
  <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M7 24 L23.5 8 L41 24.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11.5 20.5 V39 C11.5 39.8 12.2 40.5 13 40.5 H33.5 C34.3 40.5 35 39.8 35 39 V20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 40 V29.5 C20 28.7 20.7 28 21.5 28 H26 C26.8 28 27.5 28.7 27.5 29.5 V40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 15 C33 12.5 33 10 31.5 6.5" stroke="var(--clay)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="31.5" cy="6" r="1.6" fill="var(--clay)"/>
  </svg>
  <span class="badge">VORN Challenge 2026</span>
  <h1>空き家AIプランナー</h1>
  <p class="lead">空き家の活用プランを、チャットで相談するか、マップから直接探すか選べます。</p>

  <div class="choices">
    <a class="choice-card" href="/diagnosis">
      <div class="choice-icon">💬</div>
      <div class="choice-title">チャットで調べる</div>
      <div class="choice-desc">かんたんな診断からスタートし、AIとの対話であなたに合った空き家・活用プランを提案してもらう。改修コストや収支、補助金もまとめて確認できます。</div>
    </a>
    <a class="choice-card" id="map-card" href="#">
      <div class="choice-icon">🗺️</div>
      <div class="choice-title">地図で調べる</div>
      <div class="choice-desc">マップ上で物件を選びながら、収支グラフや補助金情報を確認し、提案書(PDF)を出力できます。</div>
    </a>
  </div>

  <footer>チャットと地図画面は行き来できます</footer>

<script>
  function getAkiyaAuth() {
    try { return JSON.parse(sessionStorage.getItem('akiya_auth') || 'null'); } catch (e) { return null; }
  }

  function akiyaLogout() {
    try { sessionStorage.removeItem('akiya_auth'); } catch (e) { /* noop */ }
    window.location.href = '/login';
  }

  function showGuestLockNotice(message) {
    const existing = document.getElementById('akiya-lock-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = 'akiya-lock-toast';
    toast.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#2f2e2b; color:#fff; padding:12px 18px; border-radius:10px 10px 10px 2px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,0.25); z-index:9999; display:flex; align-items:center; gap:6px; white-space:nowrap;';
    toast.textContent = message || '🔒 この機能はログインすると使えます';
    const link = document.createElement('a');
    link.href = '/login';
    link.textContent = 'ログインする →';
    link.style.cssText = 'color:#fff; text-decoration:underline; font-weight:700; margin-left:4px;';
    toast.appendChild(link);
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 4000);
  }

  function renderAkiyaStatusBar() {
    const el = document.getElementById('akiyaStatusBar');
    if (!el) return;
    const auth = getAkiyaAuth();
    if (!auth) return;
    if (auth.mode === 'user') {
      el.innerHTML = `👤 ${auth.name ? auth.name + 'さんとして' : ''}ログイン中　・　<a href="#" id="akiyaLogoutLink">ログアウト</a>`;
    } else {
      el.innerHTML = '🔓 ゲストモードでご利用中　・　<a href="/login">ログインする</a>';
    }
    const logoutLink = document.getElementById('akiyaLogoutLink');
    if (logoutLink) logoutLink.addEventListener('click', (e) => { e.preventDefault(); akiyaLogout(); });
  }
  renderAkiyaStatusBar();

  // 地図(フロント、C担当作成)へのリンク先。
  // ローカルでフロント側のサーバー(PDF出力/app.py)も立ち上げている間は http://localhost:8080/ でOK。
  // フロントを別途デプロイしたら、そのURLに書き換えてください。
  const FRONTEND_URL = "https://empty-house2026-1.onrender.com/";
  const mapCard = document.getElementById("map-card");
  mapCard.href = FRONTEND_URL;
  mapCard.addEventListener("click", (e) => {
    // ゲストモードでは「地図で調べる」(マップ・PDF出力)の利用を制限する。
    const auth = getAkiyaAuth();
    if (!auth || auth.mode !== "user") {
      e.preventDefault();
      showGuestLockNotice('🔒 マップ・PDF出力の閲覧にはログインが必要です');
    }
  });
</script>
</body>
</html>
