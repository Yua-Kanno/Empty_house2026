<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>空き家AIプランナー</title>
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --text: #2b2b28;
    --muted: #7a756a;
    --accent: #3c6e52;
    --accent-soft: #e5efe8;
    --border: #e3ded2;
    --user-bubble: #3c6e52;
    --user-bubble-text: #ffffff;
    --agent-bubble: #f0ede4;
    --deco: #cfe3d4;
  }
  /* ===== 季節テーマ(body[data-season]で切り替え) ===== */
  body[data-season="spring"] {
    --bg: #fbf3f6; --accent: #b9557a; --accent-soft: #fbe6ee; --border: #efd9e0;
    --user-bubble: #b9557a; --agent-bubble: #fbeef2; --deco: #f6c6d6; --muted: #8a737c;
  }
  body[data-season="summer"] {
    --bg: #eef7f6; --accent: #1f7a8c; --accent-soft: #dff1f3; --border: #cfe6e8;
    --user-bubble: #1f7a8c; --agent-bubble: #e2f2f3; --deco: #a9dce2; --muted: #66838a;
  }
  body[data-season="autumn"] {
    --bg: #f6efe4; --accent: #a4502a; --accent-soft: #f6e3d3; --border: #e6d6c0;
    --user-bubble: #a4502a; --agent-bubble: #f3e6d2; --deco: #e9b98a; --muted: #85705c;
  }
  body[data-season="winter"] {
    --bg: #eef2f7; --accent: #3f5f86; --accent-soft: #e1e9f3; --border: #d3dce8;
    --user-bubble: #3f5f86; --agent-bubble: #e6ecf4; --deco: #bcd0e6; --muted: #6a7a8d;
  }
  body { transition: background-color 0.6s ease, color 0.6s ease; }
  header, footer, .bubble, .card, .nav-link, button, textarea { transition: background-color 0.6s ease, border-color 0.6s ease, color 0.6s ease; }
  header, footer, main { position: relative; z-index: 1; }
  header { background: color-mix(in srgb, var(--panel) 88%, var(--deco)); }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--deco), var(--accent));
  }
  #season-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .season-switch { display: flex; gap: 4px; background: var(--accent-soft); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .season-btn {
    background: transparent; color: var(--accent); border: none; border-radius: 999px;
    padding: 5px 11px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .season-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .season-btn.active { background: var(--accent); color: #fff; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  @media (max-width: 720px) { .header-row { flex-direction: column; align-items: flex-start; } .header-actions { justify-content: flex-start; } }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-link {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-link:hover { border-color: var(--accent); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg-row {
    display: flex;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { flex-direction: column; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg-row.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .tool-tag {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .card-title { font-weight: 600; margin-bottom: 4px; }
  .card-row { color: var(--muted); font-size: 12px; }
  .card.subsidy { border-left: 3px solid var(--accent); }
  .card.cost, .card.income { border-left: 3px solid #a06b3c; }
  .card.expandable { cursor: pointer; transition: border-color 0.15s ease; }
  .card.expandable:hover { border-color: var(--accent); }
  .card-toggle { font-size: 11px; color: var(--accent); margin-top: 6px; }
  .card-detail { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 2px; }
  .card-detail[hidden] { display: none; }
  .card.shop-image { border-left: 3px solid #6b5ca0; }
  .card.shop-image img {
    width: 100%;
    border-radius: 8px;
    margin-top: 6px;
    display: block;
  }
  .card.shop-image .card-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }
  .input-row {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; }
  .loading .bubble { color: var(--muted); font-style: italic; }
</style>
</head>
<body data-season="autumn">
<canvas id="season-canvas" aria-hidden="true"></canvas>
<header>
  <div class="header-row">
    <div>
      <h1><span id="season-icon">🍁</span> 空き家AIプランナー</h1>
      <p>チャットで希望を伝えると、空き家候補・改修コスト・収支・補助金をまとめて提案します(対応エリア: 千葉県・東京都西多摩地域・埼玉県羽生市)</p>
    </div>
    <div class="header-actions">
      <a class="nav-link" href="/">🏠 トップへ</a>
      <a class="nav-link" id="frontend-link" href="http://localhost:8080/" target="_blank" rel="noopener">🗺️ マップ・PDF出力を見る</a>
    </div>
  </div>
</header>

<main id="chat-log"></main>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="例: 千葉県でカフェを開きたい。予算は300万円くらい。" onkeydown="handleKeydown(event)" oncompositionstart="handleCompositionStart()" oncompositionend="handleCompositionEnd()"></textarea>
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>
  <div class="hint">Enterで送信 / Shift+Enterで改行</div>
</footer>

<script>
  // このセッションだけの一時的なID(ページを再読み込みすると新しい会話になります)
  const sessionState = { id: null };

  // フロント(マップ・グラフ・PDF出力画面、C担当作成)へのリンク先。
  // ローカルで両方のサーバーを立ち上げている間は http://localhost:8080/ でOK。
  // フロントを別途デプロイしたら、そのURLに書き換えてください。
  const FRONTEND_URL = "https://empty-house2026-1.onrender.com/";
  document.getElementById("frontend-link").href = FRONTEND_URL;

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function appendMessage(role, text) {
    const log = document.getElementById("chat-log");
    const row = el("div", `msg-row ${role}`);
    const bubble = el("div", "bubble", text);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function renderToolResults(container, toolCalls) {
    if (!toolCalls || toolCalls.length === 0) return;
    const wrap = el("div", "cards");

    for (const tc of toolCalls) {
      if (tc.name === "search_akiya" && tc.result && tc.result.results) {
        for (const p of tc.result.results) {
          const card = el("div", "card akiya expandable");
          const priceText = (p.price_man_yen === null || p.price_man_yen === undefined) ? "価格応相談" : `${p.price_man_yen}万円`;
          card.appendChild(el("div", "card-title", `${p.title || p.municipality || p.area}(${priceText})`));
          card.appendChild(el("div", "card-row",
            `延床${p.building_area_sqm}㎡ / ${p.structure} / ${p.layout}${p.floors ? ` / ${p.floors}階建` : ""}`));
          if (p.features) card.appendChild(el("div", "card-row", p.features));

          // クリックすると、この物件を選択した状態でフロント(マップ・グラフ・PDF出力画面)を新しいタブで開く。
          const toggle = el("div", "card-toggle", "🗺️ マップ・PDF出力で見る");
          card.appendChild(toggle);

          if (p.id) {
            card.addEventListener("click", () => {
              window.open(`${FRONTEND_URL}?property_id=${p.id}`, "_blank");
            });
          }

          wrap.appendChild(card);
        }
      }
      if (tc.name === "estimate_renovation_cost" && tc.result) {
        const r = tc.result;
        const card = el("div", "card cost");
        card.appendChild(el("div", "card-title", `改修コスト概算: 約${r.estimated_cost_man_yen}万円`));
        if (r.cost_range_man_yen) {
          card.appendChild(el("div", "card-row", `想定レンジ: ${r.cost_range_man_yen.min}〜${r.cost_range_man_yen.max}万円`));
        }
        wrap.appendChild(card);
      }
      if (tc.name === "simulate_income" && tc.result) {
        const r = tc.result;
        const card = el("div", "card income");
        card.appendChild(el("div", "card-title", `月次収支概算: 利益 約${r.monthly_profit_man_yen}万円/月`));
        card.appendChild(el("div", "card-row",
          `売上 約${r.monthly_revenue_man_yen}万円 / コスト 約${r.monthly_cost_man_yen}万円`
          + (r.payback_period_years ? ` / 投資回収 約${r.payback_period_years}年` : "")));
        wrap.appendChild(card);
      }
      if (tc.name === "search_subsidies" && tc.result && tc.result.results) {
        for (const s of tc.result.results) {
          const card = el("div", "card subsidy");
          card.appendChild(el("div", "card-title", s.title));
          card.appendChild(el("div", "card-row", `${s.provider} / 上限${s.max_amount_man_yen}万円 / ${s.subsidy_rate}`));
          wrap.appendChild(card);
        }
      }
      if (tc.name === "generate_shop_image" && tc.result) {
        const r = tc.result;
        const card = el("div", "card shop-image");
        if (r.image_base64) {
          card.appendChild(el("div", "card-title", "🎨 AIが生成したイメージ"));
          const img = document.createElement("img");
          img.src = `data:${r.mime_type || "image/png"};base64,${r.image_base64}`;
          img.alt = "AIが生成した店舗・ロゴのイメージ画像";
          card.appendChild(img);
          card.appendChild(el("div", "card-note", "※AIによるイメージ案です。実際のデザインを保証するものではありません。"));
        } else {
          card.appendChild(el("div", "card-title", "🎨 画像を生成できませんでした"));
          if (r.error) card.appendChild(el("div", "card-row", r.error));
        }
        wrap.appendChild(card);
      }
    }

    if (wrap.children.length > 0) container.appendChild(wrap);
  }

  async function sendMessage(presetText) {
    const input = document.getElementById("input");
    const btn = document.getElementById("send-btn");
    const text = (presetText !== undefined ? presetText : input.value).trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";
    btn.disabled = true;

    const log = document.getElementById("chat-log");
    const loadingRow = el("div", "msg-row agent loading");
    loadingRow.appendChild(el("div", "bubble", "考え中..."));
    log.appendChild(loadingRow);
    log.scrollTop = log.scrollHeight;

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionState.id, message: text }),
      });
      loadingRow.remove();

      if (!resp.ok) {
        const errBody = await resp.json().catch(() => ({}));
        appendMessage("agent", `エラーが発生しました: ${errBody.detail || resp.statusText}`);
        return;
      }

      const data = await resp.json();
      sessionState.id = data.session_id;
      const bubbleContainer = appendMessage("agent", data.reply).parentElement;
      renderToolResults(bubbleContainer, data.tool_calls);
    } catch (err) {
      loadingRow.remove();
      appendMessage("agent", `通信エラーが発生しました: ${err}`);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  // 日本語入力(IME)変換中に確定のEnterで誤送信しないようにするためのフラグ。
  // compositionstart〜compositionendの間は変換中とみなし、Enterでは送信しない。
  let isComposing = false;

  function handleCompositionStart() {
    isComposing = true;
  }

  function handleCompositionEnd() {
    isComposing = false;
  }

  function handleKeydown(e) {
    // isComposing: 変換中かどうかの標準的な判定。
    // keyCode === 229: 一部ブラウザでcompositionendの発火タイミングがずれるための保険。
    if (e.key === "Enter" && !e.shiftKey && !isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendMessage();
    }
  }


  // ===== 季節テーマ(春夏秋冬) =====
  // 今日の日付から季節を自動判定(3-5月=春 / 6-8月=夏 / 9-11月=秋 / 12-2月=冬)。
  const SEASONS = {
    spring: { icon: "🌸" }, summer: { icon: "🌻" }, autumn: { icon: "🍁" }, winter: { icon: "⛄" },
  };
  function currentSeasonByDate() {
    const m = new Date().getMonth() + 1;
    if (m >= 3 && m <= 5) return "spring";
    if (m >= 6 && m <= 8) return "summer";
    if (m >= 9 && m <= 11) return "autumn";
    return "winter";
  }
  let season = currentSeasonByDate();
  try { localStorage.removeItem("akiya-season"); } catch (e) {}  // 以前のボタン選択の保存値を破棄

  const canvas = document.getElementById("season-canvas");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let particles = [];
  let W = 0, H = 0;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuildParticles();
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeParticle(initial) {
    const p = { x: rand(0, W), y: initial ? rand(0, H) : rand(-40, -5), phase: rand(0, Math.PI * 2) };
    if (season === "spring") {            // 桜の花びら
      Object.assign(p, { size: rand(5, 9), vy: rand(0.5, 1.2), sway: rand(0.4, 1.1), rot: rand(0, 6.28), vr: rand(-0.03, 0.03) });
    } else if (season === "summer") {     // 蛍・きらめき
      Object.assign(p, { y: rand(0, H), size: rand(1.8, 3.8), vx: rand(-0.25, 0.25), vy: rand(-0.3, 0.15), speed: rand(0.01, 0.025) });
    } else if (season === "autumn") {     // 落ち葉
      const colors = ["#d9822b", "#c0502d", "#b5651d", "#e0a030", "#9c4a1a"];
      Object.assign(p, { size: rand(7, 12), vy: rand(0.7, 1.6), sway: rand(0.6, 1.4), rot: rand(0, 6.28), vr: rand(-0.04, 0.04), color: colors[Math.floor(Math.random() * colors.length)] });
    } else {                              // 雪
      Object.assign(p, { size: rand(3, 8), vy: rand(0.5, 1.4), sway: rand(0.2, 0.7) });
    }
    return p;
  }
  function rebuildParticles() {
    const n = Math.max(18, Math.min(60, Math.round((W * H) / 22000)));
    particles = Array.from({ length: n }, () => makeParticle(true));
  }

  function drawParticle(p, t) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (season === "spring") {
      ctx.rotate(p.rot);
      ctx.fillStyle = "rgba(244,165,190,0.8)";
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,225,235,0.9)";
      ctx.beginPath(); ctx.ellipse(-p.size * 0.2, 0, p.size * 0.4, p.size * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    } else if (season === "summer") {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * p.speed * 60 + p.phase));
      ctx.shadowColor = "rgba(255,214,80," + a + ")"; ctx.shadowBlur = 14;
      ctx.fillStyle = "rgba(255,226,110," + a + ")";
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (season === "autumn") {
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.quadraticCurveTo(p.size * 0.9, -p.size * 0.1, 0, p.size);
      ctx.quadraticCurveTo(-p.size * 0.9, -p.size * 0.1, 0, -p.size);
      ctx.fill();
      ctx.strokeStyle = "rgba(90,40,10,0.45)"; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(0, p.size); ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.strokeStyle = "rgba(130,165,205,0.55)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (season === "summer") {
        p.x += p.vx + Math.sin(t / 900 + p.phase) * 0.3;
        p.y += p.vy;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      } else {
        p.y += p.vy;
        p.x += Math.sin(t / 1000 + p.phase) * p.sway;
        if (p.rot !== undefined) p.rot += p.vr;
        if (p.y > H + 20) particles[i] = makeParticle(false);
      }
      drawParticle(p, t / 1000);
    }
    if (!document.hidden) requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduceMotion) requestAnimationFrame(tick); });

  function applySeason(name) {
    season = name;
    document.body.setAttribute("data-season", name);
    document.getElementById("season-icon").textContent = SEASONS[name].icon;
        rebuildParticles();
    if (reduceMotion) ctx.clearRect(0, 0, W, H);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  applySeason(season);
  if (!reduceMotion) requestAnimationFrame(tick);

  // 診断フォーム(/diagnosis)から遷移してきた場合は、その回答をもとにした文章を
  // 最初のユーザー発言として自動送信し、チャットをスタートする。
  const params = new URLSearchParams(window.location.search);
  const diagnosisText = params.get("diagnosis");
  if (diagnosisText) {
    appendMessage("agent", "診断ありがとうございます!内容をもとに、合いそうな空き家を探しますね。");
    sendMessage(diagnosisText);
  } else {
    appendMessage("agent", "こんにちは。移住や空き家活用について、気になっていることを教えてください。");
  }
</script>
</body>
</html>
