<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>診断 | 空き家AIプランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeece8;
    --panel: #fbfaf8;
    --text: #2f2e2b;
    --muted: #85827a;
    --accent: #3c6e52;
    --accent-deep: #294c39;
    --accent-soft: #e6efe1;
    --clay: #b0603d;
    --clay-soft: #f3e3d8;
    --border: #dcdad3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
    background:
      radial-gradient(ellipse 620px 420px at 8% -8%, rgba(70,68,62,0.07), transparent 60%),
      radial-gradient(ellipse 520px 420px at 108% 12%, rgba(70,68,62,0.05), transparent 60%),
      radial-gradient(ellipse 700px 520px at 50% 118%, rgba(70,68,62,0.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1, .badge, button, .brand-title { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }
  .wrap { width: 100%; max-width: 560px; }
  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand-mark { width: 26px; height: 26px; color: var(--accent); flex-shrink: 0; }
  .brand-title { font-size: 12px; color: var(--muted); font-weight: 500; }
  .top-nav {
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .top-nav a {
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 12px 4px 12px 4px;
    background: var(--accent-soft);
    color: var(--accent-deep);
  }
  .top-nav .skip-link-top {
    background: var(--clay-soft);
    color: #7a4128;
    border-radius: 4px 12px 4px 12px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border: 1px solid var(--border);
    padding: 4px 13px;
    border-radius: 14px 4px 14px 4px;
    margin-bottom: 12px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
  .lead { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px 22px 22px 22px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(48,42,32,0.05);
  }
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  label.q {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .hint-text { font-size: 11px; color: var(--muted); margin: -4px 0 8px; }
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px 12px 4px 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .chip.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .radio-row .chip.selected { background: var(--accent); }
  .submit-row { margin-top: 24px; text-align: center; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px 20px 20px 4px;
    padding: 12px 36px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-deep); transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: default; }
  .required { color: var(--clay); font-weight: 400; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 24 L23.5 8 L41 24.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.5 20.5 V39 C11.5 39.8 12.2 40.5 13 40.5 H33.5 C34.3 40.5 35 39.8 35 39 V20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 40 V29.5 C20 28.7 20.7 28 21.5 28 H26 C26.8 28 27.5 28.7 27.5 29.5 V40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M31 15 C33 12.5 33 10 31.5 6.5" stroke="var(--clay)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="31.5" cy="6" r="1.6" fill="var(--clay)"/>
    </svg>
    <span class="brand-title">空き家AIプランナー</span>
  </div>
  <div class="top-nav">
    <a href="/">← トップへ戻る</a>
    <a class="skip-link-top" href="/chat">診断をスキップして自由にチャットする →</a>
  </div>
  <span class="badge">STEP 1 / 診断</span>
  <h1>🧭 あなたに合った空き家を診断</h1>
  <p class="lead">かんたんな質問に答えると、その内容をもとにAIとのチャットが始まり、あなたに合った空き家や活用プランを提案します。答えられる範囲でOKです。</p>

  <form id="diagnosis-form">
    <div class="card">
      <div class="field">
        <label class="q">やってみたい仕事・興味のある働き方は?</label>
        <input type="text" name="job" placeholder="例: カフェ経営, 農業, リモートワーク, 民泊運営 など" />
      </div>

      <div class="field">
        <label class="q">あなたの性格に近いものを選んでください(複数可)</label>
        <div class="chips" data-group="personality">
          <div class="chip" data-value="のんびり派">のんびり派</div>
          <div class="chip" data-value="アクティブ派">アクティブ派</div>
          <div class="chip" data-value="人と話すのが好き">人と話すのが好き</div>
          <div class="chip" data-value="一人の時間が好き">一人の時間が好き</div>
          <div class="chip" data-value="こだわり派">こだわり派</div>
          <div class="chip" data-value="自由きままな性格">自由きままな性格</div>
        </div>
      </div>

      <div class="field">
        <label class="q">住みたい環境は?</label>
        <div class="radio-row" data-group="environment" data-mode="single">
          <div class="chip" data-value="都会寄り">都会寄り</div>
          <div class="chip" data-value="田舎・自然が多い場所">田舎・自然が多い場所</div>
          <div class="chip" data-value="海の近く">海の近く</div>
          <div class="chip" data-value="山の近く">山の近く</div>
          <div class="chip" data-value="こだわらない">こだわらない</div>
        </div>
      </div>

      <div class="field">
        <label class="q">趣味・好きなことは?</label>
        <input type="text" name="hobby" placeholder="例: 料理, DIY, 読書, 写真 など" />
      </div>

      <div class="field">
        <label class="q">理想の暮らし方は?</label>
        <input type="text" name="lifestyle" placeholder="例: 自然に囲まれてゆったり暮らしたい, 人が集まる場所を作りたい など" />
      </div>

      <div class="field">
        <label class="q">やりたいこと・夢は?<span class="required">できれば入力してください</span></label>
        <input type="text" name="dream" placeholder="例: カフェを開きたい, 農業をしたい, 移住してのんびり暮らしたい" />
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label class="q">気になっているエリアはありますか?(任意)</label>
        <div class="hint-text">全国対応です。特に千葉県内・東京都西多摩地域(奥多摩町・青梅市・あきる野市など)・埼玉県羽生市は写真付きの詳しい物件情報があります。</div>
        <input type="text" name="area" placeholder="例: 千葉県, 奥多摩町, 羽生市" />
      </div>
      <div class="field">
        <label class="q">予算のイメージはありますか?(任意・万円)</label>
        <input type="text" name="budget" placeholder="例: 300万円くらいまで" />
      </div>
    </div>

    <div class="submit-row">
      <button type="submit">診断してAIに相談する</button>
    </div>
  </form>
</div>

<script>
  // チップ(複数選択・単一選択)のトグル処理
  document.querySelectorAll('[data-group]').forEach((group) => {
    const mode = group.dataset.mode === 'single' ? 'single' : 'multi';
    group.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        if (mode === 'single') {
          group.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
          chip.classList.add('selected');
        } else {
          chip.classList.toggle('selected');
        }
      });
    });
  });

  function selectedValues(groupName) {
    const group = document.querySelector(`[data-group="${groupName}"]`);
    return Array.from(group.querySelectorAll('.chip.selected')).map((c) => c.dataset.value);
  }

  // フロント(マップ・PDF出力画面、C担当作成)へのリンク先。
  const FRONTEND_URL = "https://empty-house2026-1.onrender.com/";

  document.getElementById('diagnosis-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const job = form.job.value.trim();
    const hobby = form.hobby.value.trim();
    const lifestyle = form.lifestyle.value.trim();
    const dream = form.dream.value.trim();
    const area = form.area.value.trim();
    const budget = form.budget.value.trim();
    const personality = selectedValues('personality');
    const environment = selectedValues('environment');

    // 診断結果を、チャットの最初のメッセージとして自然文にまとめる(フォールバック用)。
    const lines = [];
    if (dream) lines.push(dream);
    if (job) lines.push(`やってみたい仕事は${job}です。`);
    if (personality.length) lines.push(`性格は${personality.join('・')}なタイプだと思います。`);
    if (environment.length) lines.push(`住みたい環境は${environment.join('・')}です。`);
    if (hobby) lines.push(`趣味・好きなことは${hobby}です。`);
    if (lifestyle) lines.push(`理想の暮らし方は「${lifestyle}」です。`);
    if (area) lines.push(`気になっているエリアは${area}です。`);
    if (budget) lines.push(`予算は${budget}くらいを考えています。`);

    const summary = lines.length > 0
      ? lines.join(' ')
      : '移住や空き家の活用について相談したいです。';

    const goToChat = () => {
      window.location.href = `/chat?diagnosis=${encodeURIComponent(summary)}`;
    };

    // 1段目: エリア等の回答から、Geminiとの会話を挟まずに直接マッチングを試みる。
    // マッチした場合はそのままフロント(マップ・PDF出力画面)へ。マッチしなければ
    // Geminiとの会話(チャット画面)にフォールバックする。
    submitBtn.disabled = true;
    submitBtn.textContent = '診断中...';
    try {
      const resp = await fetch('/api/quick-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job, personality, environment, hobby, lifestyle, dream, area, budget }),
      });
      if (!resp.ok) {
        goToChat();
        return;
      }
      const data = await resp.json();
      if (data.matched && data.results && data.results.length > 0) {
        // マッチした候補(最大3件)をチャット画面に渡し、Geminiには問い合わせずに
        // そのままチャット上でカード表示する(Gemini APIの呼び出し回数を消費しない)。
        sessionStorage.setItem('quickMatchResults', JSON.stringify(data.results));
        window.location.href = '/chat?quickmatch=1';
      } else {
        goToChat();
      }
    } catch (err) {
      // 通信エラー等が起きても、チャットでの相談は続けられるようにする。
      goToChat();
    }
  });
</script>
</body>
</html>
